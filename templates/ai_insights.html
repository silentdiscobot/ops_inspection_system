{% extends "base.html" %}
{% block content %}
<div class="page-header ai-page-header">
  <h1 class="page-title"><img src="/static/images/logo-robot.png" alt="" class="ai-logo-icon" aria-hidden="true"> 巡检解读</h1>
  <p class="page-subtitle">选择一次巡检记录，生成或查看 AI 对巡检结果的分析建议。</p>
</div>

{% if not ai_config.enabled %}
<div class="card">
  <div class="card-header">
    <div class="card-icon">🚫</div>
    <h3 class="card-title">功能已关闭</h3>
  </div>
  <div class="card-body">
    <p class="ai-disabled-text">管理员已通过 <code>OPS_AI_ENABLED=0</code> 关闭 AI 智能运维。</p>
  </div>
</div>
{% else %}
<div class="ai-insight-layout">
  <section class="card ai-insight-card ai-insight-current-card">
    <div class="card-header">
      <div class="card-icon">🧭</div>
      <h3 class="card-title">巡检结果解读</h3>
    </div>
    <div class="card-body">
      <div class="ai-insight-toolbar">
        <select id="aiInsightRun" class="form-select" aria-label="选择巡检单">
          <option value="" selected>单击选择巡检单</option>
        </select>
        <button type="button" class="btn btn-primary" id="aiInsightGenerate">生成解读</button>
      </div>
      <div class="ai-insight-result" id="aiInsightResult">
        <div class="ai-insight-placeholder">请先选择巡检单，然后生成解读；也可从下方查看历史解读。</div>
      </div>
    </div>
  </section>

  <section class="card ai-insight-card ai-insight-history-card">
    <div class="card-header">
      <div class="card-icon">🕘</div>
      <h3 class="card-title">历史解读</h3>
      <button type="button" class="btn btn-outline btn-sm ai-insight-history-refresh" id="aiInsightRefresh">刷新</button>
    </div>
    <div class="card-body">
      <div class="ai-insight-history" id="aiInsightHistory"></div>
    </div>
  </section>
</div>
{% endif %}
{% endblock %}

{% block scripts %}
<script>
  window.AI_PAGE_CONFIG = {
    enabled: {{ 'true' if ai_config.enabled else 'false' }},
    page: '{{ ai_config.page }}',
    role: '{{ ai_config.role }}',
    traditionalFallback: {{ 'true' if ai_config.traditional_fallback else 'false' }},
    maskIp: {{ 'true' if ai_config.mask_ip else 'false' }},
    allowCloud: {{ 'true' if ai_config.allow_cloud else 'false' }},
    maxInputChars: {{ ai_config.max_input_chars }},
    actionTtl: {{ ai_config.action_ttl }},
    dailyTokenLimit: {{ ai_config.daily_token_limit }}
  };
</script>
<script src="/static/ai-markdown.js?v=1"></script>
<script src="/static/ai.js?v=8"></script>
{% endblock %}
